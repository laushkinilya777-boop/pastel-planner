<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6e6ff">
  <title>Мой планер</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <nav class="nav">
    <a href="#/today" class="active"><span>🌸</span>Сегодня</a>
    <a href="#/week"><span>🗓️</span>Неделя</a>
    <a href="#/month"><span>📅</span>Месяц</a>
    <a href="#/images"><span>🐱</span>Картинки</a>
  </nav>

  <main class="app" id="app">
    <!-- Временная страница для согласования палитры (шаг 2). Заменится в шаге 7. -->
    <h1 style="margin:8px 0 4px">Мой планер</h1>
    <p style="color:var(--ink-soft);margin:0 0 18px">Понедельник, 23 ноября</p>

    <section class="card">
      <div class="task"><div class="check"></div><span class="time">09:00</span><span>Йога</span></div>
      <div class="task"><div class="check done">✓</div><span class="time">11:30</span><span class="done-text">Позвонить маме</span></div>
      <div class="task"><div class="check"></div><span class="time">15:00</span><span>Дописать отчёт</span><span class="badge">↻ перенесено</span></div>
      <div style="margin-top:12px"><button class="btn">+ Задача</button> <button class="btn soft">История</button></div>
    </section>

    <section class="card">
      <h3 style="margin-bottom:8px">🎯 Цель недели: прочитать 2 книги</h3>
      <div class="progress"><i style="width:50%"></i></div>
    </section>

    <section class="card">
      <h3 style="margin-bottom:12px">Палитра</h3>
      <div class="swatches">
        <div class="swatch" style="background:var(--peach)">Персик</div>
        <div class="swatch" style="background:var(--lavender)">Лаванда</div>
        <div class="swatch" style="background:var(--mint)">Мята</div>
        <div class="swatch" style="background:var(--pink)">Розовый</div>
        <div class="swatch" style="background:var(--sky)">Голубой</div>
        <div class="swatch" style="background:var(--butter)">Ванильный</div>
        <div class="swatch" style="background:var(--red-date);color:#fff">Красная дата</div>
      </div>
    </section>
  </main>
</body>
</html>
